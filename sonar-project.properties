sonar.projectKey=mobile-observability-dashboard
sonar.projectName=Mobile Observability Dashboard
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/test/**

# Encoding
sonar.sourceEncoding=UTF-8
